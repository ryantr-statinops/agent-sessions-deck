name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=vendor
  GOPROXY: 'off'
  GOSUMDB: 'off'

jobs:
  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GO_VERSION: '1.26.7'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require committed vendored dependencies
        run: |
          if [ ! -f vendor/modules.txt ]; then
            echo "::error::vendor/modules.txt is missing; run 'make vendor' and commit the result"
            exit 1
          fi

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Run verification checks
        run: make check

      - name: Build release archives and checksums
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME:-v1.0.0}"
          make release-artifacts VERSION="$RELEASE_TAG"
          make checksums

      - name: Upload artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/sha256sums.txt
          generate_release_notes: true
